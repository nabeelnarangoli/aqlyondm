# Aqlyon content manager (Decap CMS). Open https://<your-site>/admin/ (Website content) and log in with GitHub.
# Every save is a commit to the branch below, and Netlify rebuilds the live site in about a minute.
backend:
  name: github
  repo: nabeelnarangoli/aqlyondm
  branch: main
  commit_messages:
    create: "Add {{collection}} “{{slug}}”"
    update: "Update {{collection}} “{{slug}}”"
    delete: "Delete {{collection}} “{{slug}}”"
    uploadMedia: "Upload “{{path}}”"
    deleteMedia: "Delete “{{path}}”"

# For editing on your own computer: run `npx decap-server` and `npm start`, then open http://localhost:8080/admin/content/
local_backend: true

site_url: https://aqlyondm.com
logo_url: /assets/img/aqlyon-logo.png
media_folder: src/uploads
public_folder: /uploads

collections:
  # ---------------- BLOG ----------------
  - name: blog
    label: Blog posts
    label_singular: Blog post
    description: Articles shown on /blog and the home page. Turn on “Draft” to hide a post from the site.
    folder: src/blog/posts
    create: true
    slug: "{{slug}}"
    preview_path: "blog/{{slug}}/"
    summary: "{{title}} — {{date | date('DD MMM YYYY')}}{{draft | ternary(' (draft)', '')}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false }
      - { label: Draft (hide from site), name: draft, widget: boolean, default: false, required: false }
      - label: Category
        name: category
        widget: select
        default: Marketing
        options: [Marketing, Branding, Social Media, Content, Video, Events, Lead Generation, News]
      - { label: Short summary, name: excerpt, widget: text, hint: "One or two sentences. Shown on blog cards and in Google results.", required: false }
      - { label: Cover image, name: cover, widget: image, required: false, hint: "Wide image, at least 1600 px across." }
      - { label: Cover image description, name: cover_alt, widget: string, required: false, hint: "Describe the image for people using screen readers." }
      - { label: Article, name: body, widget: markdown }
      - { label: "SEO · Focus keyword", name: focus_keyword, widget: string, required: false, hint: "The search phrase this post should rank for, e.g. 'branding agency in Kerala'. The SEO check on the right scores the post for it." }
      - { label: "SEO · Title for Google", name: seo_title, widget: string, required: false, hint: "Optional. 50–60 characters. Leave empty to use the post title + site name." }
      - { label: "SEO · Meta description", name: meta_description, widget: text, required: false, hint: "Optional. 120–160 characters shown under the title in Google. Leave empty to use the short summary." }
      - { label: "SEO · Last updated", name: updated, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false, required: false, hint: "Set this when you refresh an old post; Google sees the new date." }
      - { label: "SEO · Hide from Google", name: noindex, widget: boolean, default: false, required: false }

  # ---------------- TESTIMONIALS ----------------
  - name: testimonials
    label: Customer testimonials
    label_singular: Testimonial
    description: Real quotes from clients, shown on the home page (up to 6). The section stays hidden until you add one.
    folder: src/testimonials
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{company}}"
    sortable_fields: [order, title]
    fields:
      - { label: Client name, name: title, widget: string }
      - { label: Role, name: role, widget: string, required: false, hint: "e.g. Founder" }
      - { label: Company, name: company, widget: string, required: false }
      - { label: What they said, name: quote, widget: text }
      - { label: Star rating, name: rating, widget: number, value_type: int, min: 1, max: 5, required: false }
      - { label: Photo, name: photo, widget: image, required: false, hint: "Square photo works best. Leave empty to show their initial." }
      - { label: Display order, name: order, widget: number, value_type: int, default: 10, hint: "Lower numbers show first." }
      - { label: Hide from site, name: draft, widget: boolean, default: false, required: false }

  # ---------------- CLIENT LOGOS ----------------
  - name: clients
    label: Client logos
    label_singular: Client
    description: Logos in the scrolling strip under the home page hero. If a client has no logo, their name is shown instead.
    folder: src/clients
    create: true
    slug: "{{slug}}"
    sortable_fields: [order, title]
    fields:
      - { label: Client name, name: title, widget: string }
      - { label: Logo, name: logo, widget: image, required: false, hint: "PNG with transparent background, or a logo on white." }
      - { label: Website, name: website, widget: string, required: false }
      - { label: Display order, name: order, widget: number, value_type: int, default: 10 }
      - { label: Hide from site, name: draft, widget: boolean, default: false, required: false }

  # ---------------- EVENTS ----------------
  - name: events
    label: Event photos
    label_singular: Event
    description: Photo galleries of events you have covered. Each event gets its own page under /gallery; the newest five also appear on the home page. (Upcoming events with registration are managed at /manage.)
    folder: src/events
    create: true
    slug: "{{slug}}"
    preview_path: "gallery/{{slug}}/"
    summary: "{{title}} — {{date | date('DD MMM YYYY')}}"
    sortable_fields: [date, title]
    fields:
      - { label: Event name, name: title, widget: string }
      - { label: Event date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD MMM YYYY", time_format: false }
      - { label: Location, name: location, widget: string, required: false, hint: "e.g. Dubai, UAE" }
      - { label: Client / organiser, name: client, widget: string, required: false }
      - { label: Short summary, name: summary, widget: text, required: false }
      - { label: Cover photo, name: cover, widget: image, required: false, hint: "Leave empty to use the first gallery photo." }
      - label: Gallery photos
        name: photos
        widget: list
        allow_add: true
        collapsed: true
        summary: "{{fields.caption}}"
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Caption, name: caption, widget: string, required: false }
      - { label: Recap video link, name: video, widget: string, required: false, hint: "YouTube or Instagram link" }
      - { label: Write-up, name: body, widget: markdown, required: false }
      - { label: Hide from site, name: draft, widget: boolean, default: false, required: false }

  # ---------------- SITE CONTENT ----------------
  - name: settings
    label: Site content
    editor: { preview: false }
    files:
      - name: home
        label: Home page text
        file: src/_data/home.json
        fields:
          - label: Hero (top of page)
            name: hero
            widget: object
            fields:
              - { label: Small label, name: kicker, widget: string }
              - { label: Headline line 1, name: line1, widget: string }
              - { label: Headline line 2 (before the animated word), name: line2_prefix, widget: string }
              - { label: Animated green word, name: line2_highlight, widget: string }
              - { label: Headline line 3, name: line3, widget: string }
              - { label: Intro text, name: intro, widget: text }
              - { label: Dark button, name: primary_cta, widget: string }
              - { label: Green button (opens WhatsApp), name: secondary_cta, widget: string }
          - label: Journey (scroll story)
            name: journey
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Steps
                name: chapters
                widget: list
                min: 7
                max: 7
                allow_add: false
                hint: "Seven steps, each with its own animation, in this order: start, logo, assets, content, social, leads, sales."
                summary: "{{fields.kicker}} — {{fields.title}}"
                fields:
                  - { label: Short label, name: kicker, widget: string }
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: body, widget: text }
                  - { label: We deliver, name: tag, widget: string }
          - label: Services
            name: services
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Intro, name: intro, widget: text }
              - { label: Popup contact heading, name: popup_contact_heading, widget: string, required: false }
              - label: Service tiles
                name: items
                widget: list
                min: 7
                max: 7
                allow_add: false
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Short description, name: summary, widget: string, required: false }
                  - { label: Popup text, name: details, widget: text, required: false, hint: "Shown when someone clicks the tile." }
                  - { label: "What's included", name: includes, widget: list, required: false, field: { label: Item, name: item, widget: string } }
          - { label: Client logos heading, name: clients_heading, widget: string }
          - { label: Testimonials heading, name: testimonials_heading, widget: string }
          - { label: Events heading, name: events_heading, widget: string }
          - { label: Events intro, name: events_intro, widget: text }
          - { label: Blog heading, name: blog_heading, widget: string }
          - label: Contact section
            name: contact
            widget: object
            fields:
              - { label: Heading line 1, name: heading_line1, widget: string }
              - { label: Heading line 2 (green), name: heading_line2, widget: string }
              - { label: Call-back form intro, name: form_intro, widget: string }
      - name: site
        label: Contact details & social links
        file: src/_data/site.json
        fields:
          - { label: Site name, name: title, widget: string }
          - { label: "Home page title for Google", name: seo_home_title, widget: string, hint: "Shown after the site name on the home page tab and in Google, e.g. 'Branding & Digital Marketing Agency in Dubai and Kerala'." }
          - { label: "Home page focus keyword", name: seo_home_keyword, widget: string, required: false, hint: "The main search phrase the home page should rank for. The SEO report at /seo scores the home page for it." }
          - { label: "Google Search Console verification code", name: google_verification, widget: string, required: false, hint: "Only the content=\"…\" value from Search Console's HTML tag method." }
          - { label: Google description, name: description, widget: text }
          - { label: Website address, name: url, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: WhatsApp number for buttons, name: whatsapp, widget: string, hint: "Include country code, e.g. +971509693948" }
          - label: Offices
            name: offices
            widget: list
            summary: "{{fields.label}} — {{fields.company}}"
            fields:
              - { label: Region label, name: label, widget: string, hint: "Small heading, e.g. UAE or Kerala" }
              - { label: Logo, name: logo, widget: image, required: false, hint: "Shown on the dark contact section, so use a version with light or green colours on a transparent background." }
              - { label: Company name, name: company, widget: string }
              - { label: Address, name: address, widget: text, required: false }
              - { label: Phone / WhatsApp, name: phone, widget: string }
          - label: Social links
            name: social
            widget: object
            fields:
              - { label: Instagram, name: instagram, widget: string }
              - { label: Facebook, name: facebook, widget: string }
              - { label: LinkedIn, name: linkedin, widget: string }
              - { label: YouTube, name: youtube, widget: string }
